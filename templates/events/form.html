{% extends 'base.html' %}
{% block title %}{{ action }} Event – Pillai University{% endblock %}
{% block content %}

<div class="mb-6">
  <a href="/events" class="text-sm text-gray-500 hover:text-gray-700">← Back to Events</a>
  <h1 class="text-2xl font-bold text-gray-900 mt-2">{{ action }} Event</h1>
</div>

<div class="max-w-2xl">
  <form method="post" class="bg-white border rounded-xl shadow-sm p-6 space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Event Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" value="{{ form_data.get('name', '') }}" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
        placeholder="e.g. Technical Workshop 2024">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Organizer <span class="text-red-500">*</span></label>
      <input type="text" name="organizer" value="{{ form_data.get('organizer', '') }}" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
        placeholder="e.g. CS Department">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Expected Attendance <span class="text-red-500">*</span></label>
      <input type="number" name="expected_attendance" value="{{ form_data.get('expected_attendance', '') }}" required min="1"
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
        placeholder="e.g. 200">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Start Date & Time <span class="text-red-500">*</span></label>
        <input type="datetime-local" name="start_datetime" value="{{ form_data.get('start_datetime', '') }}" required
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">End Date & Time <span class="text-red-500">*</span></label>
        <input type="datetime-local" name="end_datetime" value="{{ form_data.get('end_datetime', '') }}" required
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Status <span class="text-red-500">*</span></label>
      <select name="status" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
        {% for s in status_choices %}
        <option value="{{ s }}" {% if form_data.get('status', 'Draft') == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea name="description" rows="3"
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
        placeholder="Optional details about the event">{{ form_data.get('description', '') }}</textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-orange-600 hover:bg-orange-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
        {{ action }} Event
      </button>
      <a href="/events" class="border px-5 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
