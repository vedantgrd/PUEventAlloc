{% extends 'base.html' %}
{% block title %}Login – Pillai University{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-orange-500 flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3">P</div>
      <h1 class="text-2xl font-bold text-gray-900">Pillai University</h1>
      <p class="text-sm text-gray-500 mt-1">Event Resource Management System</p>
    </div>
    <div class="bg-white border rounded-xl shadow-sm p-6">
      <h2 class="font-semibold text-gray-800 mb-5">Sign In</h2>
      <form method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input type="text" name="username" required autofocus
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            placeholder="Enter username">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" required
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            placeholder="Enter password">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="remember" id="remember" class="accent-orange-500">
          <label for="remember" class="text-sm text-gray-600">Remember me</label>
        </div>
        <button type="submit"
          class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 rounded-lg text-sm font-medium transition">
          Sign In
        </button>
      </form>
      <div class="mt-4 p-3 bg-gray-50 rounded-lg text-xs text-gray-500">
        <div class="font-medium mb-1">Demo accounts:</div>
        <div>Admin: <code class="bg-gray-200 px-1 rounded">admin</code> / <code class="bg-gray-200 px-1 rounded">admin123</code></div>
        <div>Organizer: <code class="bg-gray-200 px-1 rounded">organizer</code> / <code class="bg-gray-200 px-1 rounded">org123</code></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
